name: Parse CUNY Seminar PDF

on:
  push:
    paths:
      - 'data/bulletin.pdf'
      - 'PDF_scraper.py'
      - 'requirements.txt'
      - '.github/workflows/scrape.yml'
  schedule:
    - cron: '0 16 * * 1'   # Mondays 12:00 ET (EDT)
  workflow_dispatch:

jobs:
  parse:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Parse bulletin PDF
        run: python PDF_scraper.py

      - name: Commit and push updated JSON
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/seminars.json
          if git diff --staged --quiet; then
            echo "No changes to data/seminars.json"
          else
            git commit -m "chore: update seminars.json [skip ci]"
            git push
          fi