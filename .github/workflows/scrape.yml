name: Parse CUNY Seminar PDF

on:
  # Trigger when the bulletin PDF is updated
  push:
    paths:
      - 'data/bulletin.pdf'
      - 'PDF_scraper.py'
      - 'requirements.txt'
      - '.github/workflows/scrape.yml'

  # Weekly refresh (in case the PDF is committed but the parser is unchanged)
  schedule:
    # Every Monday at 12:00 PM ET (16:00 UTC during EDT, 17:00 UTC during EST)
    - cron: '0 16 * * 1'

  # Manual trigger from the Actions tab
  workflow_dispatch:

# Cancel an in-flight run if a new one starts
concurrency:
  group: parse-seminars
  cancel-in-progress: true

jobs:
  parse:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the updated JSON

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Parse bulletin PDF
        run: python PDF_scraper.py

      - name: Commit and push updated JSON
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/seminars.json
          if git diff --staged --quiet; then
            echo "No changes to data/seminars.json"
          else
            git commit -m "chore: update seminars.json [skip ci]"
            git push
          fi
