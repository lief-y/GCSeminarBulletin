aw": "NA", "website": "https://sites.google.com/view/cunyfda2026/home", "abstract": null}, {"date": "2026-09-23", "day": "Wednesday", "time": "2:00PM- 3:30PM", "room": "Room 4214.03", "location": "Room 4214.03", "seminar": "The New York City Category Theory Seminar", "speaker": "Sridhar Ramesh", "title": "Categorical Structures for Gödel Incompleteness and Löb’s Theorem", "speaker_title_raw": "Sridhar Ramesh Categorical Structures for Gödel Incompleteness and Löb’s Theorem", "website": "", "abstract": null}, {"date": "2026-09-24", "day": "Thursday", "time": "1:00PM – 3:00PM", "room": "Room 8203", "location": "Room 8203", "seminar": "Number Theory Reading Seminar", "speaker": "Wuxuan", "title": "Examples of Absolute Galois Groups", "speaker_title_raw": "Wuxuan Examples of Absolute Galois Groups", "website": "https://karolkoziol.github.io/seminar.html", "abstract": null}, {"date": "2026-09-24", "day": "Thursday", "time": "2:00PM- 4:00PM", "room": "Room 9116", "location": "Room 9116", "seminar": "Geometric Group Theory Student Seminar", "speaker": "Manvendra Somvanshi", "title": "Thurston's Asymmetric Metric, Stretch Rays, and Dilation Rays", "speaker_title_raw": "Manvendra Somvanshi Thurston's Asymmetric Metric, Stretch Rays, and Dilation Rays", "website": "https://sites.google.com/view/cunyggt/home", "abstract": "Thurston introduced the Lipschitz and length spectrum metric in order to study the existence of minimal Lipschitz maps between different hyperbolic structures on the same surface. In this talk we will cover the definitions and some results by Thurston about these metrics. We will also talk about geodesics for the Thurston metric including Stretch rays, and if time permits also talk about a generalization of stretch rays called Dilation rays."}, {"date": "2026-09-24", "day": "Thursday", "time": "2:00PM- 4:00PM", "room": "Room 6494", "location": "Room 6494", "seminar": "General topics in Dynamics", "speaker": "", "title": "NA", "speaker_title_raw": "NA", "website": "", "abstract": null}, {"date": "2026-09-24", "day": "Thursday", "time": "2:00PM-3:30PM", "room": "Room 4214.03", "location": "Room 4214.03", "seminar": "Nonlinear Analysis and PDEs seminar", "speaker": "Samuel Magill (CUNY Graduate Center)", "title": "Liouville Equation with Dirac Singularities", "speaker_title_raw": "Samuel Magill (CUNY Graduate Center) Liouville Equation with Dirac Singularities", "website": "https://www.math.csi.cuny.edu/~mlucia/Seminars/index.html", "abstract": "I will present some recent results obtained for some Dirichlet semilinear problems with exponential nonlinearity Je^t and Dirac source terms located on a two dimensional domain. So far the existence of solutions was known when the parameter J is below 2 pi, and I will show how this can be improved up to some optimal threshold. October 22nd, 2:00pm-3:30pm (in person) Andras Balogh (College of Staten Island, CUNY) Global Solutions of the Higgs Boson Equation in de Sitter Spacetime Abstract: We investigate the Higgs Boson Equation in de Sitter Spacetime. We prove the existence and uniqueness of global–in–time solutions for initial data of arbitrary size with compact support. The proof uses Galerkin's method, based on various a priori norm estimates. November 19th, 2:00pm-3:30pm (in person) TBA TBA Abstract:"}, {"date": "2026-09-24", "day": "Thursday", "time": "2:30PM - 4:00PM", "room": "Online", "location": "Online", "seminar": "New York Number Theory Seminar", "speaker": "Kevin O'Bryant, College of Staten Island (CUNY)", "title": "", "speaker_title_raw": "Kevin O'Bryant, College of Staten Island (CUNY)", "website": "", "abstract": null}, {"date": "2026-09-24", "day": "Thursday", "time": "4:15PM-6:15PM", "room": "Room 6417", "location": "Room 6417", "seminar": "CUNY Geometric Analysis Seminar", "speaker": "", "title": "Seminar starts on Oct 1st.", "speaker_title_raw": "Seminar starts on Oct 1st.", "website": "https://www.lehman.edu/faculty/rbettiol/seminar.html", "abstract": null}, {"date": "2026-09-24", "day": "Thursday", "time": "4:30PM- 7:00PM", "room": "Room 4102", "location": "Room 4102", "seminar": "New York Joint Columbia- CUNY-NYU Number Theory Seminar", "speaker": "", "title": "Seminar starts on Oct 1st.", "speaker_title_raw": "Seminar starts on Oct 1st.", "website": "", "abstract": null}, {"date": "2026-09-25", "day": "Friday", "time": "9:30AM - 11:00AM", "room": "Room 6417", "location": "Room 6417", "seminar": "CUNY Representation Theory Seminar", "speaker": "", "title": "Not meeting this week.", "speaker_title_raw": "Not meeting this week.", "website": "https://sites.google.com/view/cunyrepresentationtheory/home", "abstract": "We will review the representation theory of the distribution algebra for SL(2) in characteristic p. We will apply this machinery to construct a homology theory of links whose components are colored by tilting modules. This is joint work with Y. Qi, L.H. Robert, and E. Wagner."}, {"date": "2026-09-25", "day": "Friday", "time": "10:00AM – 11:30AM", "room": "Room 6421", "location": "Room 6421", "seminar": "Learning Seminar in Analysis & PDEs", "speaker": "", "title": "Paper overview session", "speaker_title_raw": "Paper overview session", "website": "", "abstract": null}, {"date": "2026-09-25", "day": "Friday", "time": "10:00AM - 11:30AM", "room": "Room 9116", "location": "Room 9116", "seminar": "Combinatorics and Geometry Learning Seminar", "speaker": "Jinyoung Park (New York University)", "title": "Asymptotic Enumeration via Graph Containers and Entropy", "speaker_title_raw": "Jinyoung Park (New York University) Asymptotic Enumeration via Graph Containers and Entropy", "website": "https://www.nycombinatorics.org/learningseminar", "abstract": "The container methods are powerful tools to bound the number of independent sets of graphs and hypergraphs, and they have been extremely influential in the area of extremal and probabilistic combinatorics. Entropy, first introduced by Shannon (1948) in the area of information theory, is a measure of the expected amount of information contained in a random variable. Entropy has seen lots of fascinating applications in a wide range of enumeration problems. In these introductory lectures, we will demonstrate how to count independent sets in regular graphs using each of these techniques, offering a concrete look at how both tools can be applied to achieve the same asymptotic results."}, {"date": "2026-09-25", "day": "Friday", "time": "10:00AM – 11:30AM", "room": "Room 4214.03", "location": "Room 4214.03", "seminar": "Algebraic Geometry Reading Seminar", "speaker": "Sevan Bharathan", "title": "Deligne Cohomology and Regulator Map I", "speaker_title_raw": "Sevan Bharathan Deligne Cohomology and Regulator Map I", "website": "https://yfei.page/seminars/agreading/", "abstract": null}, {"date": "2026-09-25", "day": "Friday", "time": "11:45AM- 12:45PM", "room": "Room 5417", "location": "Room 5417", "seminar": "Learning Seminar on Dynamical Systems and Ergodic Theory and Related Topics", "speaker": "Chenxi Wu (University of Wisconsin at Madison)", "title": "Thurston’s Algorithm for Core Entropy", "speaker_title_raw": "Chenxi Wu (University of Wisconsin at Madison) Thurston’s Algorithm for Core Entropy", "website": "https://tamara.ccny.cuny.edu/seminar.html", "abstract": "It is well known that a piecewise smooth expanding map of an interval admits an absolutely continuous invariant probability measure. If the map is deformed so as to create an indifferent fixed point—that is, a fixed point at which the derivative equals one—then the absolutely continuous invariant probability measure may either persist or become a 𝜎-finite invariant measure, depending on how rapidly the expansion changes near the fixed point."}, {"date": "2026-09-25", "day": "Friday", "time": "11:00AM – 12:30PM", "room": "Room 4214.03", "location": "Room 4214.03", "seminar": "Set Theory Seminar", "speaker": "", "title": "NA", "speaker_title_raw": "NA", "website": "https://nylogic.github.io/set-theory-seminar.html", "abstract": null}, {"date": "2026-09-25", "day": "Friday", "time": "11:45AM – 12:45PM", "room": "Hybrid, Room 4321", "location": "Hybrid, Room 4321", "seminar": "Data Science and Applied Topology Seminar", "speaker": "Harley Kaufman", "title": "Persistent Homologies of the Chess Board", "speaker_title_raw": "Harley Kaufman Persistent Homologies of the Chess Board", "website": "", "abstract": null}, {"date": "2026-09-25", "day": "Friday", "time": "11:45AM – 1:45PM", "room": "Room 6494", "location": "Room 6494", "seminar": "Differential Geometry, Topology, and Special Structures", "speaker": "Prof. Gueo Grantcharov (Florida International U.)", "title": "On the SL(n,H) and strong HKT geometry", "speaker_title_raw": "Prof. Gueo Grantcharov (Florida International U.) On the SL(n,H) and strong HKT geometry", "website": "https://www.scottwilsonmath.com/DGTsem.html", "abstract": "9/18: Shuhao Li (Stony Brook University) Title: Open-closed string topology and Lagrangian embeddings Abstract: The Maslov class is a basic invariant of a Lagrangian submanifold. However, many fundamental questions concerning constraints on the Maslov classes of Lagrangian embeddings (known as Maslov class rigidity) remain open. For example, the existence/non-existence of a Maslov-zero Lagrangian embedding of a given closed manifold L into the standard symplectic vector space C^n is a well-known problem. I will speak about a new approach to these types of questions using a construction of a (curved) deformation of the dg algebra of chains on the based loop space, following ideas from open-closed string topology, and derive new results on the Maslov class rigidity question."}, {"date": "2026-09-25", "day": "Friday", "time": "12:00PM – 1:00PM", "room": "Room 9116", "location": "Room 9116", "seminar": "New York Combinatorics Seminar", "speaker": "Quentin Dubroff (Carnegie Mellon University)", "title": "Faster Random Walks via Infrequent Steering", "speaker_title_raw": "Quentin Dubroff (Carnegie Mellon University) Faster Random Walks via Infrequent Steering", "website": "", "abstract": null}, {"date": "2026-09-25", "day": "Friday", "time": "1:45PM - 2:45PM", "room": "Room 6417", "location": "Room 6417", "seminar": "Complex Analysis and Dynamics Seminar", "speaker": "Juliet Aygun, Cornell University", "title": "Connected component of strata of k-differentials", "speaker_title_raw": "Juliet Aygun, Cornell University Connected component of strata of k-differentials", "website": "https://userhome.brooklyn.cuny.edu/aulicino/seminar/", "abstract": null}, {"date": "2026-09-25", "day": "Friday", "time": "2:00PM – 3:00PM", "room": "Online", "location": "Online", "seminar": "Recent Progress in Matrix and Polynomial Computations", "speaker": "Victor Pan (CUNY)", "title": "New Techniques for Matrix Norm Estimation", "speaker_title_raw": "Victor Pan (CUNY) New Techniques for Matrix Norm Estimation", "website": "https://sites.google.com/view/polynomials-matrices-comp/home", "abstract": null}, {"date": "2026-09-25", "day": "Friday", "time": "2:00PM - 3:45PM", "room": "Room 5417", "location": "Room 5417", "seminar": "CUNY Logic Workshop", "speaker": "Matt Frank, Independent Scholar", "title": "What is the Quantifier Cost of Eliminating Boolean Connectives?", "speaker_title_raw": "Matt Frank, Independent Scholar What is the Quantifier Cost of Eliminating Boolean Connectives?", "website": "https://nylogic.github.io/logic-workshop.html", "abstract": "September 11 No seminar today: Rosh Hashanah. September 18 2:00pm NY time Room: 5417 Hans Schoutens CUNY The benign logic of equivalent structures Abstract"}, {"date": "2026-09-25", "day": "Friday", "time": "2:00PM – 3:30PM", "room": "Room 9116", "location": "Room 9116", "seminar": "Harmonic Analysis and PDE seminar", "speaker": "Alan Chang (Washington University, St. Louis)", "title": "Projections of Random Cantor Sets", "speaker_title_raw": "Alan Chang (Washington University, St. Louis) Projections of Random Cantor Sets", "website": "https://sites.google.com/view/cuny-hapde/home", "abstract": "Spectral estimation is an area of research within signal processing concerned with determining the frequencies of a signal based on finite uniform samples disrupted by noise. There exists a family of highly celebrated spectral estimation algorithms referred to as subspace methods which are widely known and readily available to the general public. Root-MUSIC is one such algorithm that approximates the signal's frequencies by constructing a high-degree polynomial and finding a subset of roots which are closest to the complex unit circle. We prove that the selection process chooses the relevant roots of the polynomial, and provide sharp, non-asymptotic, and explicit error bounds for the accuracy of the selected roots in terms of fundamental model parameters. All results hold under a natural separation condition on the correct signal frequencies and are applicable to several versions of the problem which are used in practice."}, {"date": "2026-09-25", "day": "Friday", "time": "3:00PM – 4:00PM", "room": "Room 6417", "location": "Room 6417", "seminar": "Ergodic Theory and Dynamical Systems", "speaker": "Chenxi Wu (University of Wisconsin at Madison)", "title": "Entropy and Zeta function on Abstract Hubbard Trees", "speaker_title_raw": "Chenxi Wu (University of Wisconsin at Madison) Entropy and Zeta function on Abstract Hubbard Trees", "website": "https://tamara.ccny.cuny.edu/seminar.html", "abstract": "It is well known that a piecewise smooth expanding map of an interval admits an absolutely continuous invariant probability measure. If the map is deformed so as to create an indifferent fixed point—that is, a fixed point at which the derivative equals one—then the absolutely continuous invariant probability measure may either persist or become a 𝜎-finite invariant measure, depending on how rapidly the expansion changes near the fixed point."}, {"date": "2026-09-25", "day": "Friday", "time": "4:00PM - 5:00PM", "room": "Room 4214.03", "location": "Room 4214.03", "seminar": "Commutative Algebra and Algebraic Geometry Seminar", "speaker": "", "title": "Seminar starts on October 2.", "speaker_title_raw": "Seminar starts on October 2.", "website": "https://openlab.citytech.cuny.edu/caag/", "abstract": "We introduce and study Cayley-Hadamard algebras, a generalization of the algebra of square matrices. A Cayley-Hadamard algebra is a vector space equipped with a pair of bilinear operations, the “Cayley product” (generalizing the ordinary matrix product) making it an associative algebra, and the “Hadamard product” (generalizing the entrywise, or Hadamard, product of matrices) making it a commutative algebra; it also comes with a linear involution, generalizing the matrix transpose, which is an automorphism of the Hadamard product and an anti-automorphism of the Cayley product. It is required to satisfy various additional axioms relating the two products with each other and with the involution. Examples include:"}, {"date": "2026-09-25", "day": "Friday", "time": "4:15PM - 6:15PM", "room": "Room 6417", "location": "Room 6417", "seminar": "NY Group Theory Seminar", "speaker": "Alina Vdovina (City College)", "title": "Equations in Products of Free Groups and 3-Manifold Groups (joint with Olga Kharlampovich)", "speaker_title_raw": "Alina Vdovina (City College) Equations in Products of Free Groups and 3-Manifold Groups (joint with Olga Kharlampovich)", "website": "", "abstract": null}, {"date": "2026-09-25", "day": "Friday", "time": "5:00PM- 6:15PM", "room": "Room 4213.03", "location": "Room 4213.03", "seminar": "Student Logic Seminar", "speaker": "", "title": "NA", "speaker_title_raw": "NA", "website": "https://sites.google.com/view/cuny-student-logic-seminar/schedule", "abstract": "Location: Thesis room Friday / 2 October 2026 / 5pm Speaker: Brandon Ward Title: Abstract: Location: Thesis room"}, {"date": "2026-09-28", "day": "Monday", "time": "4:00P y": "Thursday", "time": "2:00PM-3:30PM", "room": "Room 4214.03", "location": "Room 4214.03", "seminar": "Nonlinear Analysis and PDEs seminar", "speaker": "", "title": "Not meeting this week.", "speaker_title_raw": "Not meeting this week.", "website": "https://www.math.csi.cuny.edu/~mlucia/Seminars/index.html", "abstract": "I will present some recent results obtained for some Dirichlet semilinear problems with exponential nonlinearity Je^t and Dirac source terms located on a two dimensional domain. So far the existence of solutions was known when the parameter J is below 2 pi, and I will show how this can be improved up to some optimal threshold. October 22nd, 2:00pm-3:30pm (in person) Andras Balogh (College of Staten Island, CUNY) Global Solutions of the Higgs Boson Equation in de Sitter Spacetime Abstract: We investigate the Higgs Boson Equation in de Sitter Spacetime. We prove the existence and uniqueness of global–in–time solutions for initial data of arbitrary size with compact support. The proof uses Galerkin's method, based on various a priori norm estimates. November 19th, 2:00pm-3:30pm (in person) TBA TBA Abstract:"}, {"date": "2026-10-01", "day": "Thursday", "time": "2:30PM - 4:00PM", "room": "Online", "location": "Online", "seminar": "New York Number Theory Seminar", "speaker": "", "title": "NA", "speaker_title_raw": "NA", "website": "", "abstract": null}, {"date": "2026-10-01", "day": "Thursday", "time": "4:15PM-6:15PM", "room": "Room 6417", "location": "Room 6417", "seminar": "CUNY Geometric Analysis Seminar", "speaker": "John Kerin", "title": "", "speaker_title_raw": "John Kerin", "website": "https://www.lehman.edu/faculty/rbettiol/seminar.html", "abstract": null}, {"date": "2026-10-01", "day": "Thursday", "time": "4:30PM- 7:00PM", "room": "Room 512", "location": "Room 512", "seminar": "New York Joint Columbia- CUNY-NYU Number Theory Seminar", "speaker": "Nina Zubrilina", "title": "", "speaker_title_raw": "Nina Zubrilina", "website": "", "abstract": null}, {"date": "2026-10-02", "day": "Friday", "time": "9:30AM - 11:00AM", "room": "Room 6417", "location": "Room 6417", "seminar": "CUNY Representation Theory Seminar", "speaker": "", "title": "Not meeting this week.", "speaker_title_raw": "Not meeting this week.", "website": "https://sites.google.com/view/cunyrepresentationtheory/home", "abstract": "We will review the representation theory of the distribution algebra for SL(2) in characteristic p. We will apply this machinery to construct a homology theory of links whose components are colored by tilting modules. This is joint work with Y. Qi, L.H. Robert, and E. Wagner."}, {"date": "2026-10-02", "day": "Friday", "time": "10:00AM – 11:30AM", "room": "Room 6421", "location": "Room 6421", "seminar": "Learning Seminar in Analysis & PDEs", "speaker": "", "title": "NA", "speaker_title_raw": "NA", "website": "", "abstract": null}, {"date": "2026-10-02", "day": "Friday", "time": "10:00AM - 11:30AM", "room": "Room 9116", "location": "Room 9116", "seminar": "Combinatorics and Geometry Learning Seminar", "speaker": "", "title": "NA", "speaker_title_raw": "NA", "website": "https://www.nycombinatorics.org/learningseminar", "abstract": "The container methods are powerful tools to bound the number of independent sets of graphs and hypergraphs, and they have been extremely influential in the area of extremal and probabilistic combinatorics. Entropy, first introduced by Shannon (1948) in the area of information theory, is a measure of the expected amount of information contained in a random variable. Entropy has seen lots of fascinating applications in a wide range of enumeration problems. In these introductory lectures, we will demonstrate how to count independent sets in regular graphs using each of these techniques, offering a concrete look at how both tools can be applied to achieve the same asymptotic results."}, {"date": "2026-10-02", "day": "Friday", "time": "10:00AM – 11:30AM", "room": "Room 4214.03", "location": "Room 4214.03", "seminar": "Algebraic Geometry Reading Seminar", "speaker": "Valeriy Sergeev", "title": "Deligne Cohomology and Regulator Map II", "speaker_title_raw": "Valeriy Sergeev Deligne Cohomology and Regulator Map II", "website": "https://yfei.page/seminars/agreading/", "abstract": null}, {"date": "2026-10-02", "day": "Friday", "time": "11:45AM- 12:45PM", "room": "Room 5417", "location": "Room 5417", "seminar": "Learning Seminar on Dynamical Systems and Ergodic Theory and Related Topics", "speaker": "", "title": "NA", "speaker_title_raw": "NA", "website": "https://tamara.ccny.cuny.edu/seminar.html", "abstract": "It is well known that a piecewise smooth expanding map of an interval admits an absolutely continuous invariant probability measure. If the map is deformed so as to create an indifferent fixed point—that is, a fixed point at which the derivative equals one—then the absolutely continuous invariant probability measure may either persist or become a 𝜎-finite invariant measure, depending on how rapidly the expansion changes near the fixed point."}, {"date": "2026-10-02", "day": "Friday", "time": "11:00AM – 12:30PM", "room": "Room 4214.03", "location": "Room 4214.03", "seminar": "Set Theory Seminar", "speaker": "", "title": "NA", "speaker_title_raw": "NA", "website": "https://nylogic.github.io/set-theory-seminar.html", "abstract": null}, {"date": "2026-10-02", "day": "Friday", "time": "11:45AM – 12:45PM", "room": "Hybrid, Room 4321", "location": "Hybrid, Room 4321", "seminar": "Data Science and Applied Topology Seminar", "speaker": "Abigail Barnes", "title": "Memory-Efficient Spatial Colocation Mining with Prefix-Guided Pattern Growth and a Star Neighborhood Upper Bound Filter", "speaker_title_raw": "Abigail Barnes Memory-Efficient Spatial Colocation Mining with Prefix-Guided Pattern Growth and a Star Neighborhood Upper Bound Filter", "website": "", "abstract": null}, {"date": "2026-10-02", "day": "Friday", "time": "11:45AM – 1:45PM", "room": "Room 6494", "location": "Room 6494", "seminar": "Differential Geometry, Topology, and Special Structures", "speaker": "Prof. Yueqiao Wu (Johns Hopkins)", "title": "", "speaker_title_raw": "Prof. Yueqiao Wu (Johns Hopkins)", "website": "https://www.scottwilsonmath.com/DGTsem.html", "abstract": "9/18: Shuhao Li (Stony Brook University) Title: Open-closed string topology and Lagrangian embeddings Abstract: The Maslov class is a basic invariant of a Lagrangian submanifold. However, many fundamental questions concerning constraints on the Maslov classes of Lagrangian embeddings (known as Maslov class rigidity) remain open. For example, the existence/non-existence of a Maslov-zero Lagrangian embedding of a given closed manifold L into the standard symplectic vector space C^n is a well-known problem. I will speak about a new approach to these types of questions using a construction of a (curved) deformation of the dg algebra of chains on the based loop space, following ideas from open-closed string topology, and derive new results on the Maslov class rigidity question."}, {"date": "2026-10-02", "day": "Friday", "time": "12:00PM – 1:00PM", "room": "Room 9116", "location": "Room 9116", "seminar": "New York Combinatorics Seminar", "speaker": "Kristina Wicke (New Jersey Institute of Technology)", "title": "", "speaker_title_raw": "Kristina Wicke (New Jersey Institute of Technology)", "website": "", "abstract": null}, {"date": "2026-10-02", "day": "Friday", "time": "1:45PM - 2:45PM", "room": "Room 6417", "location": "Room 6417", "seminar": "Complex Analysis and Dynamics Seminar", "speaker": "", "title": "NA", "speaker_title_raw": "NA", "website": "https://userhome.brooklyn.cuny.edu/aulicino/seminar/", "abstract": null}, {"date": "2026-10-02", "day": "Friday", "time": "2:00PM – 3:00PM", "room": "Online", "location": "Online", "seminar": "Recent Progress in Matrix and Polynomial Computations", "speaker": "", "title": "NA", "speaker_title_raw": "NA", "website": "https://sites.google.com/view/polynomials-matrices-comp/home", "abstract": null}, {"date": "2026-10-02", "day": "Friday", "time": "2:00PM - 3:45PM", "room": "Room 5417", "location": "Room 5417", "seminar": "CUNY Logic Workshop", "speaker": "", "title": "Not meeting this week.", "speaker_title_raw": "Not meeting this week.", "website": "https://nylogic.github.io/logic-workshop.html", "abstract": "September 11 No seminar today: Rosh Hashanah. September 18 2:00pm NY time Room: 5417 Hans Schoutens CUNY The benign logic of equivalent structures Abstract"}, {"date": "2026-10-02", "day": "Friday", "time": "2:00PM – 3:30PM", "room": "Room 9116", "location": "Room 9116", "seminar": "Harmonic Analysis and PDE seminar", "speaker": "Ludovick Bouthat (University of Delaware)", "title": "The Sharp Constant in The Mashreghi--Ransford Inequality", "speaker_title_raw": "Ludovick Bouthat (University of Delaware) The Sharp Constant in The Mashreghi--Ransford Inequality", "website": "https://sites.google.com/view/cuny-hapde/home", "abstract": "Spectral estimation is an area of research within signal processing concerned with determining the frequencies of a signal based on finite uniform samples disrupted by noise. There exists a family of highly celebrated spectral estimation algorithms referred to as subspace methods which are widely known and readily available to the general public. Root-MUSIC is one such algorithm that approximates the signal's frequencies by constructing a high-degree polynomial and finding a subset of roots which are closest to the complex unit circle. We prove that the selection process chooses the relevant roots of the polynomial, and provide sharp, non-asymptotic, and explicit error bounds for the accuracy of the selected roots in terms of fundamental model parameters. All results hold under a natural separation condition on the correct signal frequencies and are applicable to several versions of the problem which are used in practice."}, {"date": "2026-10-02", "day": "Friday", "time": "3:00PM – 4:00PM", "room": "Room 6417", "location": "Room 6417", "seminar": "Ergodic Theory and Dynamical Systems", "speaker": "", "title": "NA", "speaker_title_raw": "NA", "website": "https://tamara.ccny.cuny.edu/seminar.html", "abstract": "It is well known that a piecewise smooth expanding map of an interval admits an absolutely continuous invariant probability measure. If the map is deformed so as to create an indifferent fixed point—that is, a fixed point at which the derivative equals one—then the absolutely continuous invariant probability measure may either persist or become a 𝜎-finite invariant measure, depending on how rapidly the expansion changes near the fixed point."}, {"date": "2026-10-02", "day": "Friday", "time": "4:00PM - 5:00PM", "room": "Room 4214.03", "location": "Room 4214.03", "seminar": "Commutative Algebra and Algebraic Geometry Seminar", "speaker": "Ben Blum-Smith, Johns Hopkins University", "title": "Cayley-Hadamard Algebras", "speaker_title_raw": "Ben Blum-Smith, Johns Hopkins University Cayley-Hadamard Algebras", "website": "https://openlab.citytech.cuny.edu/caag/", "abstract": "We introduce and study Cayley-Hadamard algebras, a generalization of the algebra of square matrices. A Cayley-Hadamard algebra is a vector space equipped with a pair of bilinear operations, the “Cayley product” (generalizing the ordinary matrix product) making it an associative algebra, and the “Hadamard product” (generalizing the entrywise, or Hadamard, product of matrices) making it a commutative algebra; it also comes with a linear involution, generalizing the matrix transpose, which is an automorphism of the Hadamard product and an anti-automorphism of the Cayley product. It is required to satisfy various additional axioms relating the two products with each other and with the involution. Examples include:"}, {"date": "2026-10-02", "day": "Friday", "time": "4:15PM - 6:15PM", "room": "Room 6417", "location": "Room 6417", "seminar": "NY Group Theory Seminar", "speaker": "Ilya Kapovich (Hunter College and CUNY Graduate Center)", "title": "Small Cancellation Stability and Isomorphism Rigidity of Generic Finitely Presented Groups", "speaker_title_raw": "Ilya Kapovich (Hunter College and CUNY Graduate Center) Small Cancellation Stability and Isomorphism Rigidity of Generic Finitely Presented Groups", "website": "", "abstract": null}, {"date": "2026-10-02", "day": "Friday", "time": "5:00PM- 6:15PM", "room": "Room 4213.03", "location": "Room 4213.03", "seminar": "Student Logic Seminar", "speaker": "", "title": "NA", "speaker_title_raw": "NA", "website": "https://sites.google.com/view/cuny-student-logic-seminar/schedule", "abstract": "Location: Thesis room Friday / 2 October 2026 / 5pm Speaker: Brandon Ward Title: Abstract: Location: Thesis room"}]};</script>
